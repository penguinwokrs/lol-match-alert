name: Keyboard support or verification
description: Ask for a keyboard the wizard could not set up, or report how an unverified one behaved
labels: [keyboard]
body:
  - type: input
    id: model
    attributes:
      label: Keyboard model
      placeholder: e.g. Keychron V1 Max
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Device details
      description: From the wizard's "Copy details" button.
      render: text
    validations:
      required: true
  - type: dropdown
    id: via
    attributes:
      label: Does the keyboard work with the VIA app (usevia.app) or Keychron Launcher?
      options: ["Yes", "No", "Not sure"]
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Output of `lol-match-alert.exe --test`
      description: For a keyboard the app already knows, such as an unverified Pulsar. Run it from the install folder.
      render: text
  - type: dropdown
    id: replug
    attributes:
      label: After --test, unplug the keyboard and plug it back in. Which lighting is on it?
      options: ["My own lighting", "The app's colors", "Something else", "Did not try"]
