name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # The tray targets net10.0-windows; EnableWindowsTargeting lets it build here. Every other
      # project is plain net10.0, so the whole test suite runs on Linux.
      - run: dotnet build MatchAlert.sln -warnaserror
      - run: dotnet test MatchAlert.sln --no-build
